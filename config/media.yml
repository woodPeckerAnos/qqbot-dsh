# ============================================================================
# 模块：富媒体（attachments 入站 / media 出站）
#
# 本文件由 qqbot.yml 的 include 加载。与平台无关，官方与 OneBot 共用同一套配额。
# 这里只放"图片/语音/引用/转发/文件怎么进出模型与用户"，不含接入平台细节。
#
# 模块开关：在 qqbot.yml 里注释掉对应 include 行，或写成 enabled: false。
# 注意：attachments.forward / attachments.files 是同一模块下的子块，
# 独立开关在各自的 enabled 上，不需要拆成单独 include。
# ============================================================================

# --- 富媒体输入（图片 / 语音 / 引用 / 卡片送进模型）--------------------------
# 与平台无关，官方与 OneBot 共用。环境变量前缀：BOT_ATTACHMENT_*
#
# 能收到什么、会怎么送进模型：
#   - 图片：官方 attachments(content_type=image/*) 与 OneBot image 段 → 内联成
#     多模态 image block（下载 → 嗅探真实格式 → 超限的降采样或切片 → base64）；
#   - 引用：官方 message_type=103 的 msg_elements、OneBot reply 段（回查 get_msg）
#     → 渲染成 `[引用 谁] 内容`，被引用消息里的图片同样会被内联；
#   - 转发消息块（合并转发 / 聊天记录）：优先用上报里已经带上的逐条内容，只有
#     拿到 id 时才回查 get_forward_msg → 渲染成带条号的逐条发言（谁说了什么一
#     目了然），见下方 forward 子节；
#   - 文件（PDF / 文本等）：下载 → 原文落工作区 inbox/ → 抽取正文送进模型
#     （PDF 走 pdftotext），见下方 files 子节；
#   - 语音：官方给 asr_refer_text 时直接用它的识别文本（本项目不做本地语音识别）；
#   - 视频/卡片：渲染成 `[视频: x.mp4]` / `[卡片消息 …]` 一行说明，不送字节。
#
# 注意：所有这些内容进 prompt 都会消耗额外的 token 与带宽；用本地小模型/纯文本
# 模型时建议把 enabled 设为 false（关掉后消息仍能收到，只是变成 `[图片]` 占位）。
attachments:
  # 是否把图片内联送进模型（需要模型支持多模态）
  enabled: true
  # 单条消息最多取几张图（含引用消息里的图片）。超出的只留文字说明。
  # 注意长图切片后**每块算一张**，因此一条消息最终内联的张数可能多于这个值
  # （另有 maxImageTiles 与 runtime 的"单条 prompt 最多 20 张"两道闸）。
  maxImages: 4
  # 单张图片内联进 prompt 的最大字节数（默认 8MB）。超限的**不再直接丢掉**：
  # 先尝试降采样/重新编码压到限内，实在压不下来才只留文字说明。
  # 下载阶段允许到 32MB（多拉的字节就是为了压到这里的限内）。
  maxImageBytes: 8388608
  # 一张长图最多切成几块。为什么需要切片：模型对**每张图**只有 64 万像素的
  # 预算（deepseek-flash 的 imagePixelBudget），1080×20000 的长截图整张缩下去
  # 只剩 185px 宽，文字完全不可读；切成 ≤64 万像素一块，每块都能按原分辨率读。
  # 12 块 ≈ 一张 1080×7100 的聊天记录，视觉 token 约 1 万；上限 20 是 runtime
  # 单条 prompt 的图片张数上限。调小省 token，调大读长图（超出部分会在正文里
  # 明确写"其余未读入"）。
  maxImageTiles: 12
  # 单张图片下载超时（毫秒）；下载失败会降级成文字说明，不影响文字部分回答
  downloadTimeoutMs: 15000

  # 转发消息块（合并转发 / 聊天记录）。env 前缀：BOT_ATTACHMENT_FORWARD_*
  # 四重上限都刻意保守：一个转发块动辄上百条，全量展开既烧 token 也把真正
  # 的问题淹掉。**超限不是错误**，是在正文里写一句"仅展开以上条目"。
  #
  # 展开的两条来源（按优先级）：
  #   1. 上报里已内联的逐条内容（NapCat 的 forward.data.content）——零请求、
  #      且不受"消息 id 约 5000 条后被 LRU 淘汰"影响；
  #   2. 只有 id 时回查 get_forward_msg（go-cqhttp / Lagrange 等）。
  #
  # ⚠️ 这里配的上限**同时管两条路径**：
  #   - @ 消息自带的转发：归一化后立刻展开（用户转发过来就是在说"看这个"）；
  #   - **旁听**消息里的转发：默认**不展开**（不当普通群聊上下文），只留占位与 id；
  #     只有被 @ 且这次的问题明确提到它时（由话题判定那一次 LLM 调用顺带判出）
  #     才回查。见 docs/DESIGN.md §11.10。
  forward:
    # 是否展开转发块。关掉后：OneBot 只留 `[聊天记录]` 占位（且不发任何回查请求，
    # 内联内容也不展开）；官方侧退化成平铺文本——它的内容随事件一起推来，
    # 丢掉纯属浪费。
    enabled: true
    # 单个转发块最多展开几条
    maxNodes: 20
    # 单条发言的字符上限（超出截断，防一条长文吃掉整个预算）
    maxNodeChars: 500
    # 一个转发块展开后的总字符上限
    maxChars: 4000
    # 最多再下钻几层嵌套转发（0 = 只展开最外层；最外层永远展开）
    maxDepth: 2
    # 回查超时（毫秒）
    timeoutMs: 10000

  # 文件（PDF 等）的下载与解析。env 前缀：BOT_ATTACHMENT_FILE_* / BOT_ATTACHMENT_INBOX_*
  # 机制（详见 docs/FORWARD-FILE-INGRESS-PLAN.md）：下载 → 原文落到工作区 inbox/
  # → 抽取正文（PDF 走 pdftotext，纯文本类直读）→ 截断后送进 prompt。
  # 落盘的意义是让 agent 能回头深挖（"把那份 PDF 的第三页表格给我"）。
  files:
    # 是否下载并解析文件
    enabled: true
    # 单条消息最多解析几个文件（超出的只列名字与体积）
    maxFiles: 2
    # 单文件字节上限；平台声明超限时不下载
    maxFileBytes: 16777216
    # 抽取文本的字符上限（超出截断并在 prompt 里说明）
    maxExtractChars: 20000
    # PDF 最多读多少页
    maxPdfPages: 30
    # 解析子进程超时（毫秒）
    extractTimeoutMs: 10000
    # 是否把原文落到工作区 inbox/（关掉后只把抽取的文本送进模型，agent 拿不到原件）
    saveToInbox: true
    # 工作区内目录名。**必须与 media.outboxDir 不同名**——outbox 是发回用户的，
    # 同名会让用户发来的文件被立刻回发给自己（启动期会直接报错拦下）。
    inboxDir: inbox
    # inbox 文件保留天数，超期清理（0 = 不清理）
    retentionDays: 7
    # 单会话 inbox 总字节上限（MB）。超出时**删最旧的**而不是拒绝新文件。
    maxInboxMB: 200
    # 允许抽取正文的扩展名白名单（小写）。不在名单里的文件**不下载**，只写一行说明。
    # 不建议把 sh / py / exe 这类可执行文件加进来：落盘位置是 agent 的工作区，
    # 而 agent 有执行能力——"用户发来的脚本被 agent 顺手跑一下"是没必要开的口子。
    extractExtensions: [pdf, txt, md, csv, json, yaml, yml, log, xml, html]

# --- 富媒体出站（把 agent 生成的文件发给用户）--------------------------------
# 与平台无关，官方与 OneBot 共用。环境变量前缀：BOT_MEDIA_*
#
# 机制（详见 docs/RICH-MEDIA-PLAN.md）：agent 把要发给用户的文件放进会话
# 工作区的 outbox/ 子目录（persona 里已约定），一轮回答结束后机器人扫描该
# 目录、逐个发送、发完归档到 outbox/.sent/。
#   - 图片（png/jpg/jpeg/gif，白名单见下）以图片消息内联展示；
#   - 其余一律以文件消息发送（可下载、可转发）；
#   - 官方平台附件与文本共享回复配额：平时给文本保底 1 条，
#     只剩 1 条额度时附件优先。
media:
  enabled: true
  # 单附件体积上限（MB）。超出的文件降级为文本里的一行说明。
  # base64 传输体积 +33%，不建议调大。
  maxFileMB: 20
  # 单次回复最多发几个附件，超出的降级为文本说明
  maxAttachmentsPerMsg: 4
  # 图片扩展名白名单（小写不带点）。svg/webp/bmp 等不在名单里的按文件发——
  # "以文件形式收到的 svg"用户能打开，"以图片形式发被平台拒掉的"什么都看不到。
  imageExtensions: [png, jpg, jpeg, gif]
  # 工作区内的约定目录名（纯目录名，不能含路径分隔符）
  outboxDir: outbox
