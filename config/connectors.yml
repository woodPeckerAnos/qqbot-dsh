# ============================================================================
# 模块：接入平台（connectors / qq-official / onebot）
#
# 本文件由 qqbot.yml 的 include 加载；只放"接哪个平台、平台侧配额与协议参数"。
# 密钥不在这里：QQ_APP_ID / QQ_APP_SECRET / ONEBOT_ACCESS_TOKEN 只在 .env。
#
# 模块开关：在 qqbot.yml 里注释掉对应 include 行，或写成 enabled: false。
# 取值优先级：环境变量 > 本文件（含其他模块的覆盖）> 代码内置默认。
# ============================================================================

# --- 接入平台 ----------------------------------------------------------------
# 可并存，共享同一个 DSH 池与编排层。
#   qq-official  官方开放平台（api.bot.qq.com）
#   onebot       社区框架（LLBot / NapCat 等 OneBot v11 实现，反向 WS 接入）
# 环境变量：BOT_CONNECTORS
connectors:
  - qq-official
  - onebot

# --- 官方开放平台（connectors 含 qq-official 时生效）-------------------------
# 环境变量前缀：QQ_*
qq-official:
  # OpenAPI 基址；2026-08-10 起统一为 api.bot.qq.com
  apiBase: https://api.bot.qq.com
  # 订阅的 intents 位掩码。
  # 默认 = GROUP_AND_C2C_EVENT(1<<25) + GROUP_MEMBER_EVENT(1<<24) = 50331648
  # 注意：1<<25 同时承载群聊 @消息与单聊消息，intent 层无法只订其中一种。
  # 如果连接被 4014（intent 无权限）拒绝，把这里改成 33554432 再试。
  intents: 50331648
  # 发消息用 0(纯文本) 还是 2(markdown)。markdown 的渲染效果依客户端版本而异，
  # 所以默认走纯文本。
  msgType: 0
  # 单条消息最大字符数。官方未公布数值上限，只在超限时报 40054007，保守取 1500。
  maxChars: 1500
  # 群聊一次提问允许的最大回复条数（官方硬上限 5，留 1 条余量给错误提示）
  maxRepliesPerMsg: 4
  # 进度回执：turn 超过多少毫秒后发第一条「仍在处理中」
  progressAfterMs: 90000
  progressIntervalMs: 90000
  # 进度回执条数上限，必须小于 maxRepliesPerMsg（给最终答案留配额）
  progressMax: 3
  # 单轮任务超时（毫秒），到点取消该轮。
  # 硬约束：必须 < 300000 —— 群聊被动回复窗口只有 5 分钟，超时提示也要在窗口内发出。
  turnTimeoutMs: 240000
  # 单聊（C2C）。单聊与群聊共用 1<<25 这一个 intent，无法在订阅层屏蔽，
  # 所以要"只服务群聊"必须靠这个开关。
  c2c:
    enabled: true
    # 单聊每条消息最大回复条数。官方上限 4（群聊是 5，两个值不能共用）。
    maxRepliesPerMsg: 4
    # 单聊进度回执上限，必须小于上面的 maxRepliesPerMsg
    progressMax: 2

# --- OneBot v11 社区框架（connectors 含 onebot 时生效）-----------------------
# 环境变量前缀：ONEBOT_*
# 接入方式：本服务起 WS server，LLBot/NapCat 作为客户端连入（反向 WS）。
# 框架侧要填：ws://127.0.0.1:6700/onebot/v11/ws，token 与 ONEBOT_ACCESS_TOKEN 一致。
onebot:
  # ⚠⚠ 必须保持 0.0.0.0，不要改成 127.0.0.1。
  #   框架跑在宿主、本服务在 Docker 时，宿主看到的 127.0.0.1:6700 是 Docker 的
  #   端口转发，它落到**容器网卡**上；容器里若只绑 loopback，转发就够不到，
  #   症状是"端口映射看着正常但框架死活连不上"。
  host: 0.0.0.0
  # ⚠ 不要改这个端口：docker-compose.yml 里的端口映射写死了 127.0.0.1:6700:6700，
  #   改这里会让映射指空。要改就得两处一起改。
  port: 6700
  # 是否响应私聊消息
  c2cEnabled: true
  # 收到加好友请求时自动同意（否则私聊路径永远打不开）
  autoAcceptFriend: true
  # 收到拉群邀请时自动同意。默认关闭：被拉进陌生群 = 把 agent 暴露给陌生人。
  autoAcceptGroupInvite: false
  maxChars: 1500
  # OneBot 没有平台级回复配额，这里只是防失控的安全阀
  maxRepliesPerMsg: 10
  progressMax: 3
  progressAfterMs: 90000
  progressIntervalMs: 90000
  # OneBot 没有被动回复窗口，单轮超时可以放宽到任务真正需要的时长
  turnTimeoutMs: 600000
  # 附件字节怎么传给框架（环境变量 ONEBOT_FILE_TRANSPORT）：
  #   base64（默认）：文件内容编码进 WS 帧，跨容器部署也能用；
  #   path          ：只传绝对路径，要求 bot 与框架同机同文件系统（省 33% 体积）。
  # 注意 ws 库的 maxPayload 默认 100MiB，与 media.maxFileMB 联动。
  fileTransport: base64
