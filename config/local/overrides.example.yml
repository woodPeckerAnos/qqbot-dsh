# ============================================================================
# 本机覆盖模板（不进 git）
#
#   cp config/local/overrides.example.yml config/local/overrides.yml
#
# 用途：只影响你这台机器/这次部署、但又不属于密钥的差异。qqbot.yml 的 include
# 把它放在所有共享模块之后，所以这里写的键会覆盖 config/*.yml 的同名项。
#
# 规则与共享模块完全一样：
#   - 映射深合并；数组/标量整体替换；
#   - 键名拼错、类型写错会在启动期报错并列出可用项；
#   - **仍然不允许内联密钥**——它只是不提交，不是密钥容器，凭证请放 .env。
#
# 按需取消注释即可；文件不存在时 qqbot.yml 会跳过（optional: true）。
# ============================================================================

# --- 部署形态：只开一条通道 --------------------------------------------------
# connectors: [onebot]

# --- 个人化：bot 在本群的别名（场景 4 指代检测）------------------------------
# 这些名字带个人/群特色，不适合随仓库提交，放这里最合适。
# proactive:
#   botAliases:
#     - 小助手
#     - 助手酱

# --- 本机资源与排障 ----------------------------------------------------------
# pool:
#   maxConcurrentTurns: 2
#   maxRuntimes: 4
# logLevel: debug

# --- 节假日 / 谷时段（临时日期、调休）----------------------------------------
# offpeak:
#   holidays:
#     - 2027-01-01
#     - 2027-01-02
