# ============================================================================
# 模块：DeepSeek 谷时段闸（offpeak）
#
# 本文件由 qqbot.yml 的 include 加载。只影响"命中模型在正价时段是否直接拒答"，
# 不影响接入平台与模型路由；管理员可用 /offpeak 在运行期覆盖节假日等设置。
#
# 模块开关：在 qqbot.yml 里注释掉对应 include 行，或写成 enabled: false。
# ============================================================================

# --- DeepSeek 谷时段闸 -------------------------------------------------------
# 开启后：当 <dsh.provider>/<dsh.model> 命中 modelPattern，且当前不是谷时段时，
# 直接回复提示、不调用 API（不写对话记录、不占并发名额）。
# 环境变量前缀：QQ_OFFPEAK_*
offpeak:
  # 生产环境暂不启用谷时段闸（按生产配置原值）。
  enabled: false
  # 工作日谷时段窗口，一天可以有多个，逗号分隔；每个窗口是 HH:MM-HH:MM，
  # 区间为 [start, end)。默认北京时间 00:00-09:00、12:00-14:00、18:00-24:00
  # （窗口之外 09:00-12:00、14:00-18:00 是正价时段）。
  #   - 结束时间可写 24:00 表示当天结束；也支持跨零点（如 22:00-06:00）
  #   - 窗口之间不能重叠（重叠会在启动期报错）
  #   - 也可以写成 YAML 数组：["00:00-09:00", "12:00-14:00", "18:00-24:00"]
  windows: 00:00-09:00,12:00-14:00,18:00-24:00
  # 窗口所在时区（IANA 名称；容器内默认 UTC，不要依赖宿主时区）
  timeZone: Asia/Shanghai
  # 命中判定：provider/model 组合串包含该子串（大小写不敏感）
  modelPattern: deepseek
  # 周六、周日全天按谷价（2026-08-23 起官方规则；调休上班的周末仍是周六/日，
  # 由本规则自动覆盖，无需额外配置）
  weekendsAllDay: true
  # 法定节假日全天谷价：已内置 2026 年官方节假日（国办发明电〔2025〕7 号）。
  # 跨年或临时日期在这里追加，或让管理员在 QQ 里用 /offpeak holiday add 热维护
  # （覆盖持久化，重启不丢）。
  holidays: []
  # holidays:
  #   - 2027-01-01
  #   - 2027-01-02
