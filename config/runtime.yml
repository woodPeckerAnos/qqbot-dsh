# ============================================================================
# 模块：运行时（dsh 进程 / 并发池 / 路径 / 健康检查 / 日志级别）
#
# 本文件由 qqbot.yml 的 include 加载。这里只放"进程怎么跑、资源怎么分"，
# 不决定用哪个模型——模型路由与模型选择在 config/local/models.yml（不进 git）。
#
# 模型相关的覆盖关系：
#   - 不创建 config/local/models.yml：使用代码内置默认
#     （provider=deepseek-official、model=deepseek-flash）；
#   - 创建后可在那里写 tasks.taskProvider / tasks.taskModel / models:；
#   - 新任务选择未配置时继承原 slow 路由，再退到 dsh.provider / dsh.model；
#   - 每项环境变量覆盖对应文件值，BOT_TASK_PROVIDER / BOT_TASK_MODEL 选择共享模型。
#
# 模块开关：在 qqbot.yml 里注释掉对应 include 行，或写成 enabled: false。
# ============================================================================

# --- DSH runtime -------------------------------------------------------------
dsh:
  # profile patch 的绝对路径（容器内由 compose 指定，一般不用改）
  profilePatch: /app/dsh-profile/cordis.patch.yml
  # dsh 可执行文件；默认从 PATH 解析
  bin: dsh
  startTimeoutMs: 60000
  shutdownTimeoutMs: 15000

# --- 运行时池 ----------------------------------------------------------------
pool:
  # 前台与 worker 合计硬上限（至少 2），两类容量之和不得超过它
  maxRuntimes: 8
  # 空闲 runtime 回收时间（毫秒），回收后该会话下次提问会重建会话并回放历史
  runtimeIdleMs: 1800000
  # 冷启动回放的历史轮数
  replayTurns: 12

# 每个有效输入和主动请求先运行前台；长任务派发成功后按需创建一个 worker。
# 同 Session 的前台回合与 worker 分别串行，worker 运行时前台可接收新输入。
# 排队时限单独计算；输入摄取和 runtime 初始化不计入模型执行时限。
tasks:
  reasoningEffort: high
  frontendMaxSteps: 3
  queueTimeoutMs: 1800000
  # 旧字段名保留：fast 表示前台，slow 表示 worker。
  fastRuntimes: 4
  slowRuntimes: 4
  fastTimeoutMs: 30000
  slowTimeoutMs: 1800000
  maxPerSession: 32
  maxGlobal: 128
  retentionMs: 604800000
  reminderMs: 300000
  # 前台和 worker 共用此路由；未配置时继承原 slow 的最终值。
  # taskProvider: deepseek-official
  # taskModel: deepseek-flash
  # slowProvider / slowModel 保留为共享模型的缺省来源。
  # slowProvider: deepseek-official
  # slowModel: deepseek-flash
  # fastProvider / fastModel 已弃用，生产路径忽略。

# --- 存储路径 ----------------------------------------------------------------
# 容器内由 docker-compose 的 environment 指定；这两处要保持一致。
paths:
  dshHome: /data/dsh
  workspacesRoot: /data/workspaces
  stateDir: /data/bot

# --- 健康检查 ----------------------------------------------------------------
# /healthz + /metrics；容器 HEALTHCHECK 探这个端口（compose 里未映射到宿主）
health:
  port: 8080

# --- 日志级别 ----------------------------------------------------------------
# debug | info | warn | error
# 环境变量：QQ_LOG_LEVEL
logLevel: info
