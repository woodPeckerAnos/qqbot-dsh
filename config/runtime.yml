# ============================================================================
# 模块：运行时（dsh 进程 / 并发池 / 路径 / 健康检查 / 日志级别）
#
# 本文件由 qqbot.yml 的 include 加载。这里只放"进程怎么跑、资源怎么分"，
# 不决定用哪个模型——模型路由与模型选择在 config/local/models.yml（不进 git）。
#
# 模型相关的覆盖关系：
#   - 不创建 config/local/models.yml：使用代码内置默认
#     （provider=deepseek-official、model=deepseek-flash）；
#   - 创建后可在那里写 dsh.provider / dsh.model / models:；
#   - 环境变量 DSH_PROVIDER / DSH_MODEL 仍然优先级最高。
#
# 模块开关：在 qqbot.yml 里注释掉对应 include 行，或写成 enabled: false。
# ============================================================================

# --- DSH runtime -------------------------------------------------------------
dsh:
  # profile patch 的绝对路径（容器内由 compose 指定，一般不用改）
  profilePatch: /app/dsh-profile/cordis.patch.yml
  # dsh 可执行文件；默认从 PATH 解析
  bin: dsh
  startTimeoutMs: 60000
  shutdownTimeoutMs: 15000

# --- 运行时池 ----------------------------------------------------------------
pool:
  # 双 lane 合计执行并发上限（至少 2），各 lane 执行额度之和不得超过它；不限制驻留数量
  maxRuntimes: 8
  # 兼容旧 RuntimePool 的空闲回收时间；生产 RuntimePoolV2 常驻 lane 不使用此键
  runtimeIdleMs: 1800000
  # 冷启动回放的历史轮数
  replayTurns: 12

# 每个有效输入和主动请求同时进入两个 lane；同 Session 每个 lane 串行。
# 排队和输入摄取不计入模型执行时限。快 lane 固定关闭 thinking。
tasks:
  # 执行并发，各会话 lane 在结束后保留进程和原生 session
  fastRuntimes: 4
  slowRuntimes: 4
  fastTimeoutMs: 30000
  slowTimeoutMs: 1800000
  maxPerSession: 32
  maxGlobal: 128
  retentionMs: 604800000
  reminderMs: 300000
  # 两个 lane 默认继承 dsh.provider / dsh.model；可在本机 models.yml 分别覆盖。
  # fastProvider: deepseek-official
  # fastModel: deepseek-flash
  # slowProvider: deepseek-official
  # slowModel: deepseek-flash

# --- 存储路径 ----------------------------------------------------------------
# 容器内由 docker-compose 的 environment 指定；这两处要保持一致。
paths:
  dshHome: /data/dsh
  workspacesRoot: /data/workspaces
  stateDir: /data/bot

# --- 健康检查 ----------------------------------------------------------------
# /healthz + /metrics；容器 HEALTHCHECK 探这个端口（compose 里未映射到宿主）
health:
  port: 8080

# --- 日志级别 ----------------------------------------------------------------
# debug | info | warn | error
# 环境变量：QQ_LOG_LEVEL
logLevel: info
