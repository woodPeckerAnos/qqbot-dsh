# ============================================================================
# 模块：主动发言（proactive）
#
# 本文件由 qqbot.yml 的 include 加载。只放"什么时候允许主动开口"的判据与预算，
# 不负责被 @ 的被动回复；观察窗口（旁听滚窗）在 interaction.yml。
#
# 总开关默认关闭（fail-closed）；打开后也建议先 dryRun 观察一到两周。
# 场景的自然语言真相源：src/pipeline/proactive/interests/SCENES.md
#
# 模块开关：在 qqbot.yml 里注释掉对应 include 行，或写成 enabled: false。
# 本文件内的 enabled / dryRun 是业务开关，与模块开关是两件事。
# ============================================================================

# --- 主动发言（旁听 → 判定 → 主动开口）---------------------------------------
# 环境变量前缀：BOT_PROACTIVE_* / QQ_INTERESTS_FILE
#
# 当前生效的场景清单与判据见 src/pipeline/proactive/interests/SCENES.md
# （那份文件是场景的自然语言真相源；新增场景请先改它再改代码）。
proactive:
  enabled: true          # 生产环境显式打开（代码默认关，fail-closed）
  # 灰度观察：判定照跑、记录"本应发言"，但永不真的发。生产已关闭灰度。
  dryRun: false
  # 兴趣池（场景 5）：整份内容会进判定 prompt，因此单独成文件、有独立 schema。
  # 文件不存在 = 空池（合法，场景 5 不触发）；文件存在但格式错 = 启动期报错。
  interestsEnabled: true
  interestsFile: interests.yml
  # bot 别名属于部署个性化配置，放 config/local/overrides.yml（本包已带）。
  # 留空 = 只认"机器人/助手"这类泛称，且必须与请求词同现，误命中率更低。
  # 话题滚动周期（场景 2/5 的入口）：每多少条旁听消息、或静默多久，
  # 收敛一次交给判定。默认比既有采样口径保守（宁缺勿滥）。
  topicRollMessages: 30
  topicRollMs: 300000
  # 问题挂起多久后探针（场景 3）：先给群里留出回答时间。
  questionProbeMs: 90000
  # 「让路」的预算与时长（场景 3 的 wait）：判定说"有人在答"时，
  # 只把**下一次唤醒提前一点**，而不是另起一台独立于对象的等待机器。
  #   maxWaitPerItem：同一个挂起问题最多让路几次。**默认 1（只能让一次）**，
  #                   硬上限 3——配得更大按 3 处理并在日志里 warn，因为
  #                   "把收敛改回不收敛"不该只需要改一行配置。
  #   waitYieldMs   ：让路后多久重查（毫秒，范围 15000–120000）。重查前有两道
  #                   **本地**检查（对象还在吗 / 转录有新增吗），任何一道不过
  #                   都不花判定调用；问题一旦被回答，等待当场作废。
  # 指标：wait_ticket_created / _resolved / _spent / _stale / _unchanged
  #       + wait_declined{reason}（/metrics 的 proactive 段）。
  maxWaitPerItem: 1
  waitYieldMs: 45000
  # --- 话题 session（主动发言的**唯一放行闸门**）------------------------------
  # 一次唤醒（主动/被动）→ LLM 判断 → 输出；判定说"值得"时**额外开一个话题
  # session**，在这个 session 下打开主动发言闸门，直到预算用完或被关闭。
  # 取舍已拍板：**放弃介入话题的覆盖率，换精度**——不是所有值得聊的话题都会
  # 介入，话题切换时也可能漏掉一轮机会（已知并接受，不做 topicChange）。
  # 观测：health 的 proactive.sessions（opened / closedBy / spokeInSession）。
  #
  #   sessionBudget  ：一个话题里允许的主动发言条数。默认 2，
  #                    **硬上限 5**——配得更大按 5 处理并在日志里 warn
  #                    （"少说两句"是产品决策，不该被一行配置改回去）。
  #                    ⚠️ 预算用完**不关闭 session**，只让它在当前话题里闭嘴
  #                    （预算不该驱动会话的生死）。要重新开口只有两条路，都由
  #                    **话题**驱动：模型说"换话题了"（new-topic，预算重置），
  #                    或者会话收口 / 静默超时后由下一次判定重新开一个。
  #                    指标：`proactive.sessions.budgetExhausted` = 被额度挡下的次数。
  #   sessionIdleMs  ：静默多久自动关闭 session（毫秒，范围 60000–3600000）。
  #                    锚点是 bot **自己**上次在这个 session 里发言的时间
  #                    （没说过则是开启时刻），刻意不被群消息刷新。
  #                    它同时也是"话题翻篇"的口径：会话结束后预算自然回到满值。
  #   sessionMinGapMs：同一 session 内两次发言的最小间隔（毫秒，范围
  #                    10000–300000）。间隔没到时闸门不过，且**不消耗预算**
  #                    （预算是"说了几句"的账，不是"想过几次"的账）。
  sessionBudget: 2
  sessionIdleMs: 600000
  sessionMinGapMs: 45000
  # 判定调用超时。刻意与 topic.timeoutMs 分开：话题判定只输出一个布尔值
  # （10 秒够），而主动介入要逐场景输出多段 JSON——借用 10 秒会频繁超时，
  # 而超时 = 沉默，表现就是「它从来不主动说话」。
  judgeTimeoutMs: 20000
  # 发言生成（措辞轮次）超时：判定说"值得说"之后，真实文案由一次 agent turn
  # 生成（与被动回复同一条链路：同会话、同观察窗口、可以用工具查证）。
  # 它是"插一句话"不是"跑一个任务"，上限刻意低于被动轮次——
  # 超时的表现是**本次不发言**（health 里 deliveryDegraded['compose-failed'] +1），
  # 不是报错。范围 30000–300000。
  speakTimeoutMs: 120000
