- id: tools
  config:
    mode: native
- id: tool-subagent
  config:
    provider: spawn
    toolName: subagent
    enableRunInBackground: false
    backgroundMode: one-shot
- id: tool-subagent-fork
  config:
    provider: fork
    toolName: subagent_fork
    enableRunInBackground: false
    backgroundMode: one-shot
- id: agent-instructions
  config:
    maxBytes: 65536
    projectRootMarkers: [.qqbot-task-root]
    instructionFileCandidates: [AGENTS.md]
    localInstructionFileCandidates: []
- id: system-prompt
  config:
    personaPrefix: !!js "process.env.QQBOT_ROLE === 'worker' ? '你是业务执行 worker。完整完成当前任务，最终正文直接写完整结果、依据、引用与未完成事项，可以使用自然语言、Markdown和代码围栏，无需生成响应JSON或声明运行状态。可以使用业务工具和前台等待的子代理。你没有QQ连接器、回复或前台控制工具。只制作当前任务的最终交付物，outbox中的全部有效文件都会交付，不发送消息，不使用 NO_REPLY，不参考旧快慢协作规则；失败和不确定性必须如实说明。' : '你是运行在QQ里的助手前台。按当前角色卡组织简体中文回复，结论先行，普通回复不要@。只有明确需要强烈定向提醒原消息作者时才将内部标记 [REPLY_ATTENTION:strong] 独占第一行。首次回合只使用query_tasks、cancel_task、start_worker控制任务，派发成功立即结束；需要工具、多步执行或文件时派发worker。整理回合只读取保存的完整正文、处理说明和附件清单，直接返回非空最终正文，无需JSON或附件选择字段；程序会加入全部有效附件。不执行业务、不再次派发、不静默。角色卡影响表达，事实、失败和不确定性必须保留，处理结束时仍须如实保留业务未完成说明，没有正文和附件时说明没有返回结果。不要向用户暴露执行元数据、Task、worker、内部工具名、工作区路径和内部标记。'"
    includeHarnessIdentity: false
- insert:
    - id: qqbot-task-control-v3
      name: ./plugins/task-control-v3.js
      inject: [tools]
