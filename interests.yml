# 兴趣池（主动介入场景 5）：聊到这些话题时，bot 才会考虑主动补一句。
#
# 本文件**随仓库提供，且刻意近乎为空** —— 它的作用是占位：
#   Docker 的 bind mount 在宿主文件不存在时会自动建一个同名**目录**，
#   容器启动时读到目录会拒绝启动（报「interests.yml 是一个目录，不是文件」）。
#   仓库里有这个文件，克隆/挂载后就不会踩这个坑。
#
# 空池 = 场景 5 不触发（合法状态，其余四个场景不受影响）。
# 要真的用起来，照着样例加条目（字段含义见样例的注释）：
#   cp src/pipeline/proactive/interests/interests.yml.example interests.yml
#
# 本文件即使用户改了也不该被提交（见 .gitignore）。
interests: []
