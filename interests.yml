# 兴趣池（interests）—— 场景 5 的配置面
#
# 怎么用：把本文件复制成仓库根目录的 `interests.yml`（或由
# `QQ_INTERESTS_FILE` / `qqbot.yml: proactive.interestsFile` 指定路径），
# 按下面的格式加条目即可。文件不存在 = 兴趣池为空（合法状态，场景 5 不会触发）。
#
# 规则（逐条都有测试；写错会在**启动期**报错并指出是哪一条）：
#   - id       必填，文件内唯一，用英文小写加连字符（进日志与 /metrics，别用中文）
#   - topic    必填，一句话说明"这是聊什么"（会进 prompt，写给人看）
#   - keywords 必填，**字符串包含匹配**的关键词（不是正则、不是模糊匹配）；
#              大小写不敏感；命中任意一个即算候选。所以：
#                · 太短的词（单字、"图"）会误命中，宁可用两字以上的词；
#                · 关键词越准，白花的判定调用越少（命中才进 LLM 判定）。
#   - why      选填，为什么 bot 能在这个话题上有用（进 prompt，用来约束模型别硬凑）
#   - note     选填，额外的发言约束（进 prompt，例如"只给结论别讲原理"）
#
# 不进本文件的配置（避免两套账）：
#   - 每话题最多说几次 → `VetoPolicy.maxPerTopic`（否决层，对所有场景统一）
#   - 开关 / 临时停用   → `qqbot.yml` 的 `proactive.interestsEnabled`
#
# 上限：最多 20 条（超出启动报错）。理由是整份兴趣池会进 prompt，
# 条目越多每个场景的判定越贵也越飘；宁缺勿滥。

interests:
  - id: plotting
    topic: 数据可视化 / 画图 / 图表 / 曲线趋势
    keywords: [画图, 图表, 折线图, 柱状图, 饼图, 可视化, 画个图, matplotlib]
    why: 我有 matplotlib 与文件出站能力，可以直接给出一张图
    note: 话题停在"没有结论"或"没人动手"时才补一句，并直接给图，不要先讲原理

  - id: code-debug
    topic: 代码报错 / 环境依赖 / 脚本跑不起来
    keywords: [报错, 异常, traceback, 装不上, 跑不起来, 依赖冲突, 版本不兼容]
    why: 我能直接读报错、查依赖版本、给出可复制的修复命令
    note: 只给最小修复步骤；群里已经在排查时不要抢话

  - id: file-convert
    topic: 文件格式转换 / 批量处理 / 表格清洗
    keywords: [转成, 格式转换, 批量处理, 清洗数据, 合并表格, 拆表, 转 csv, 转 excel]
    why: 我有工作区与脚本能力，可以真的把文件处理好再发回来
    note: 先确认输入文件在哪，再动手；不要只说"可以用 pandas 做"
