# ============================================================================
# qqbot-dsh 配置入口（模块清单 · 生产）
#
# 这个文件只做三件事：
#   1. 列出要加载的配置模块（tsconfig 式 include）；
#   2. 说明加载顺序、合并规则与模块开关；
#   3. 划清"可提交到 git"与"本机配置"的边界。
# 具体参数与逐项注释在 config/*.yml，改配置通常改那里，不要往本文件堆参数。
#
# 配置是本仓库的可提交部分；`config/local/` 只提供**可选加载机制**：
# `models.yml`（模型路由/模型选择）与 `overrides.yml`（本群别名）不随仓库
# 提供，也不要求存在；不创建时使用代码内置默认。需要本机差异时再按
# docs/CONFIG.md 的键名自行创建。
#
# 加载与优先级
#   - 入口：QQ_CONFIG_FILE（默认 ./qqbot.yml）；include 的相对路径以本文件为基准。
#   - 顺序：按下面的清单从上到下；后加载覆盖先加载；本文件自己的键最后合并。
#   - 合并：映射深合并（只写 onebot.port 不会抹掉 onebot.host）；
#           数组和标量整体替换（connectors: [onebot] 就是只剩 onebot）。
#   - 优先级：环境变量 > 配置文件（含模块）> 代码内置默认。
#
# 模块控制
#   - 停用模块：整行注释掉对应 include，或写成 `enabled: false`（见下方示例）。
#   - 本机可选模块：写 `optional: true`，文件不存在时跳过；文件存在但内容错
#     仍然会在启动期报错，不会静默忽略。
#   - 每个模块先单独校验再合并，所以键名拼错会指出具体是哪个文件。
#
# git 边界
#   - config/*.yml              随仓库提交 = 默认值，走 code review；
#   - config/local/*.yml        本机配置，不进 git（模型路由、个人别名等）；
#   - config/local/*.example.yml 可选模板；本仓库当前不随附，需要时自行创建。
#   密钥/管理员/群白名单只从 .env 读；个人别名等部署偏好放 config/local/。
#
# 生效方式
#   - 改本文件或 config/**：docker compose restart qqbot（不需要重建镜像）。
#   - 首次从旧版单文件配置升级：docker compose up -d 一次，让 ./config 挂载生效。
#   - 不要删掉宿主上的 config/ 目录；模块缺失会启动失败，而不是悄悄用默认值。
#
# 完整说明见 docs/CONFIG.md。
# ============================================================================

include:
  # --- 接入平台 --------------------------------------------------------------
  # connectors（启哪些平台）/ qq-official（官方开放平台）/ onebot（社区框架）
  - config/connectors.yml

  # --- 运行时 ----------------------------------------------------------------
  # dsh 进程与超时 / 并发池 / 存储路径 / 健康检查端口 / 日志级别
  - config/runtime.yml

  # --- 富媒体 ----------------------------------------------------------------
  # attachments（图片/引用/转发/文件入站）与 media（agent 产物出站）
  - config/media.yml

  # --- 交互层 ----------------------------------------------------------------
  # personas（/persona 人设）/ hints（长任务提示）/ topic（话题判定）
  # / observation（旁听滚窗，与主动发言开关解耦）
  - config/interaction.yml

  # --- 主动发言 --------------------------------------------------------------
  # proactive（旁听 → 判定 → 主动开口的场景、预算与灰度开关）
  - config/proactive.yml

  # --- 谷时段闸 --------------------------------------------------------------
  # offpeak（命中模型在正价时段直接拒答；管理员可用 /offpeak 热切换）
  - config/offpeak.yml

  # --- 本机配置（可选加载；文件不存在时自动跳过）----------------------------
  # 模型路由/模型选择：config/local/models.yml（不随仓库提供）
  - path: config/local/models.yml
    optional: true
  # 其他本机差异：config/local/overrides.yml（不随仓库提供；bot 别名等）
  - path: config/local/overrides.yml
    optional: true

# --- 模块开关示例（改上面的条目，不要直接删模块文件）------------------------
# 停用某个模块时，把上面那条**字符串条目**改成对象写法（不要在原条目之外再加
# 一行，否则会触发"重复 include"报错）。例如临时停用主动发言模块：
#
#   - path: config/proactive.yml
#     enabled: false
#
# 注意：这与 proactive.enabled 不同——后者是业务总开关，模块仍是加载的；模块
# 关掉后整段配置不存在，相关参数走代码内置默认（例如 proactive 的内置默认是关闭）。
# 只想关功能请改模块内的业务开关，不要为了"关主动发言"去关模块。

# --- 临时覆盖（只建议排障用）------------------------------------------------
# 本文件自己写的配置项最后合并，覆盖所有模块。长期的本机差异请放
# config/local/overrides.yml，别让入口重新变成大杂烩。
#
# logLevel: debug
# pool:
#   maxRuntimes: 4

# --- 只来自 .env 的密钥与个人标识 -------------------------------------------
# 配置文件里没有这些键，写了会在启动期被拒绝或当成未知项：
#   密钥：QQ_APP_ID / QQ_APP_SECRET / ONEBOT_ACCESS_TOKEN / DEEPSEEK_API_KEY
#   个人标识：BOT_ADMINS（管理员，平台:发送者id）
#             BOT_LISTEN_GROUPS（群白名单，平台:群号；留空 = 不接群也不观察）
# 条目格式与旧变量兼容说明见 .env.example 与 docs/CONFIG.md。
