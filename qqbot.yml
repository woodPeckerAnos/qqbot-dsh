# ============================================================================
# qqbot-dsh 行为配置（本文件随仓库提供，就是默认配置，**不需要复制**）
#
#   docker compose up -d      # 直接用；要改就改这里
#   docker compose restart qqbot   # 改完重启生效，不用重建镜像
#
# 密钥**不在这里**——它们只从环境读（.env 会被整份注入容器）：
#   QQ_APP_ID / QQ_APP_SECRET / DEEPSEEK_API_KEY / ONEBOT_ACCESS_TOKEN / BOT_ADMINS
#
# 取值优先级：环境变量 > 本文件 > 代码内置默认。
# 也就是说本文件里每一项都可以用对应的环境变量临时覆盖（变量名见每节注释）：
# 写进 .env 即可（它整份注入），或加到 compose 的 environment 段。
#
# 键名拼错会在启动期直接报错并列出可用项（不会静默用默认值），所以放心改。
#
# 本文件既不含密钥、也不含个人标识（管理员白名单在 .env 的 BOT_ADMINS，见下），
# 所以可以安全提交；改动它就是一份普通的本地 diff。
# ============================================================================

# --- 接入平台 ----------------------------------------------------------------
# 可并存，共享同一个 DSH 池与编排层。
#   qq-official  官方开放平台（api.bot.qq.com）
#   onebot       社区框架（LLBot / NapCat 等 OneBot v11 实现，反向 WS 接入）
# 环境变量：BOT_CONNECTORS
connectors:
  - qq-official
  - onebot

# --- 官方开放平台（connectors 含 qq-official 时生效）-------------------------
# 环境变量前缀：QQ_*
qq-official:
  # OpenAPI 基址；2026-08-10 起统一为 api.bot.qq.com
  apiBase: https://api.bot.qq.com
  # 订阅的 intents 位掩码。
  # 默认 = GROUP_AND_C2C_EVENT(1<<25) + GROUP_MEMBER_EVENT(1<<24) = 50331648
  # 注意：1<<25 同时承载群聊 @消息与单聊消息，intent 层无法只订其中一种。
  # 如果连接被 4014（intent 无权限）拒绝，把这里改成 33554432 再试。
  intents: 50331648
  # 发消息用 0(纯文本) 还是 2(markdown)。markdown 的渲染效果依客户端版本而异，
  # 所以默认走纯文本。
  msgType: 0
  # 单条消息最大字符数。官方未公布数值上限，只在超限时报 40054007，保守取 1500。
  maxChars: 1500
  # 群聊一次提问允许的最大回复条数（官方硬上限 5，留 1 条余量给错误提示）
  maxRepliesPerMsg: 4
  # 进度回执：turn 超过多少毫秒后发第一条「仍在处理中」
  progressAfterMs: 90000
  progressIntervalMs: 90000
  # 进度回执条数上限，必须小于 maxRepliesPerMsg（给最终答案留配额）
  progressMax: 3
  # 单轮任务超时（毫秒），到点取消该轮。
  # 硬约束：必须 < 300000 —— 群聊被动回复窗口只有 5 分钟，超时提示也要在窗口内发出。
  turnTimeoutMs: 240000
  # 单聊（C2C）。单聊与群聊共用 1<<25 这一个 intent，无法在订阅层屏蔽，
  # 所以要"只服务群聊"必须靠这个开关。
  c2c:
    enabled: true
    # 单聊每条消息最大回复条数。官方上限 4（群聊是 5，两个值不能共用）。
    maxRepliesPerMsg: 4
    # 单聊进度回执上限，必须小于上面的 maxRepliesPerMsg
    progressMax: 2

# --- OneBot v11 社区框架（connectors 含 onebot 时生效）-----------------------
# 环境变量前缀：ONEBOT_*
# 接入方式：本服务起 WS server，LLBot/NapCat 作为客户端连入（反向 WS）。
# 框架侧要填：ws://127.0.0.1:6700/onebot/v11/ws，token 与 ONEBOT_ACCESS_TOKEN 一致。
onebot:
  # ⚠⚠ 必须保持 0.0.0.0，不要改成 127.0.0.1。
  #   框架跑在宿主、本服务在 Docker 时，宿主看到的 127.0.0.1:6700 是 Docker 的
  #   端口转发，它落到**容器网卡**上；容器里若只绑 loopback，转发就够不到，
  #   症状是"端口映射看着正常但框架死活连不上"。
  host: 0.0.0.0
  # ⚠ 不要改这个端口：docker-compose.yml 里的端口映射写死了 127.0.0.1:6700:6700，
  #   改这里会让映射指空。要改就得两处一起改。
  port: 6700
  # 是否响应私聊消息
  c2cEnabled: true
  # 收到加好友请求时自动同意（否则私聊路径永远打不开）
  autoAcceptFriend: true
  # 收到拉群邀请时自动同意。默认关闭：被拉进陌生群 = 把 agent 暴露给陌生人。
  autoAcceptGroupInvite: false
  maxChars: 1500
  # OneBot 没有平台级回复配额，这里只是防失控的安全阀
  maxRepliesPerMsg: 10
  progressMax: 3
  progressAfterMs: 90000
  progressIntervalMs: 90000
  # OneBot 没有被动回复窗口，单轮超时可以放宽到任务真正需要的时长
  turnTimeoutMs: 600000
  # 附件字节怎么传给框架（环境变量 ONEBOT_FILE_TRANSPORT）：
  #   base64（默认）：文件内容编码进 WS 帧，跨容器部署也能用；
  #   path          ：只传绝对路径，要求 bot 与框架同机同文件系统（省 33% 体积）。
  # 注意 ws 库的 maxPayload 默认 100MiB，与 media.maxFileMB 联动。
  fileTransport: base64

# --- DSH runtime -------------------------------------------------------------
dsh:
  provider: deepseek-official
  model: deepseek-flash
  # profile patch 的绝对路径（容器内由 compose 指定，一般不用改）
  profilePatch: /app/dsh-profile/cordis.patch.yml
  # dsh 可执行文件；默认从 PATH 解析
  bin: dsh
  startTimeoutMs: 60000
  shutdownTimeoutMs: 15000

# --- 运行时池 ----------------------------------------------------------------
pool:
  # 全局并发 turn 上限（= 同时干活的会话数上限）
  maxConcurrentTurns: 4
  # 并发 runtime 进程上限（LRU 回收）
  maxRuntimes: 8
  # 空闲 runtime 回收时间（毫秒），回收后该会话下次提问会重建会话并回放历史
  runtimeIdleMs: 1800000
  # 冷启动回放的历史轮数
  replayTurns: 12

# --- 预设风格前台（/persona 命令）--------------------------------------------
# 预设目录里每个 `<名>.md` 是一个可切换的会话人设（名字限小写字母/数字/中划线）。
# 管理员在群里发 /persona <名> 切换：预设内容写进该会话工作区 AGENTS.md 的
# 标记区块，**下一条消息即生效，无需重启**（dsh-agent-instructions 每步探测
# 文件变化）；/persona off 恢复默认；/persona 列出可选项与当前选择。
# 预设只放风格与口径（口吻、详略、组织方式）；身份与纪律写在 dsh-profile 的
# personaPrefix 里全局共用，预设不要重复。仓库自带示例见 dsh-profile/personas/。
# 环境变量：BOT_PERSONA_DIR
personas:
  dir: dsh-profile/personas

# --- 长任务提示注入 ------------------------------------------------------------
# persona 纪律的桥接层补强：命中关键词的消息，prompt 里追加一段"耗时任务必须
# subagent 后台派发并立即回执"的提示。新闻核查、网页抓取这类任务模型常自判
# "不长"而在本轮同步跑，会话随之卡死（DESIGN §13.2 硬边界：协议无 cancel，
# 模型不守纪律时只能靠超时回收）。best-effort：命中只注入提示，不代替模型
# 做决定；闲聊里误命中（如"爬虫"）的代价只是一段可被忽略的提示文本。
# 环境变量：BOT_HINT_LONG_TASK_ENABLED / BOT_HINT_LONG_TASK_PATTERNS / BOT_HINT_LONG_TASK_TEXT
hints:
  longTask:
    enabled: true
    # 命中子串（大小写不敏感）。写成空数组 [] = 注入永不触发（等价于关闭）。
    patterns: [核查, 核实, 爬取, 抓取, 批量, 编译, 监控, 汇总, 调研, 新闻]

# --- 话题判定 ---------------------------------------------------------------
# 新消息与既有话题是否相关，由一个小模型调用判断（不经 DSH 进程）：
# 判定为无关 → 关闭话题（回收 runtime、跳过冷启动回放），已结束的话题不再
# 赖在上下文里。判定失败/超时一律视为相关（fail-safe，不误清上下文）。
# 管理员也可以在群里发 /new 显式开新话题。
# 密钥复用 .env 的 DEEPSEEK_API_KEY；环境变量前缀 BOT_TOPIC_*
topic:
  enabled: true
  apiBase: https://api.deepseek.com
  model: deepseek-flash
  # 单次判定超时（毫秒）；超时按相关处理
  timeoutMs: 10000
  # 送给判定器的最近记录条数（不含当前新消息）
  contextTurns: 10

# --- 存储路径 ----------------------------------------------------------------
# 容器内由 docker-compose 的 environment 指定；这两处要保持一致。
paths:
  dshHome: /data/dsh
  workspacesRoot: /data/workspaces
  stateDir: /data/bot

# --- 管理员白名单 → 在 .env 里配，不在这里 ------------------------------------
# 这是本文件里唯一会带个人标识的配置（真实 QQ 号 / openid），所以刻意**不放进
# 配置文件**，也不接受写在这里——写在这里会在启动期直接报错并告诉你该去哪配。
#
#   # .env 里：
#   BOT_ADMINS=qq-official:ABCDEF123456,onebot:123456
#
# 条目格式 `平台:发送者id`：
#   - qq-official:<openid>   群聊里是 member_openid，单聊里是 user_openid，
#                            同一个人两个值不同，都要管就都加进来
#   - onebot:<QQ号>
# 管理员两个特权：永不被谷时段闸拦截；可用 /offpeak 变更类命令热切换闸配置。
# 发现自己身份键：直接给机器人发 `/offpeak whoami`（对所有人开放）。
# 留空 = 没有管理员，变更类命令对所有人关闭（fail-closed）。
# 旧变量 QQ_ADMIN_OPENIDS 仍兼容（裸 openid 自动补 qq-official: 前缀）。

# --- DeepSeek 谷时段闸 -------------------------------------------------------
# 开启后：当 <dsh.provider>/<dsh.model> 命中 modelPattern，且当前不是谷时段时，
# 直接回复提示、不调用 API（不写对话记录、不占并发名额）。
# 环境变量前缀：QQ_OFFPEAK_*
offpeak:
  enabled: true
  # 工作日谷时段窗口，一天可以有多个，逗号分隔；每个窗口是 HH:MM-HH:MM，
  # 区间为 [start, end)。默认北京时间 00:00-09:00、12:00-14:00、18:00-24:00
  # （窗口之外 09:00-12:00、14:00-18:00 是正价时段）。
  #   - 结束时间可写 24:00 表示当天结束；也支持跨零点（如 22:00-06:00）
  #   - 窗口之间不能重叠（重叠会在启动期报错）
  #   - 也可以写成 YAML 数组：["00:00-09:00", "12:00-14:00", "18:00-24:00"]
  windows: 00:00-09:00,12:00-14:00,18:00-24:00
  # 窗口所在时区（IANA 名称；容器内默认 UTC，不要依赖宿主时区）
  timeZone: Asia/Shanghai
  # 命中判定：provider/model 组合串包含该子串（大小写不敏感）
  modelPattern: deepseek
  # 周六、周日全天按谷价（2026-08-23 起官方规则；调休上班的周末仍是周六/日，
  # 由本规则自动覆盖，无需额外配置）
  weekendsAllDay: true
  # 法定节假日全天谷价：已内置 2026 年官方节假日（国办发明电〔2025〕7 号）。
  # 跨年或临时日期在这里追加，或让管理员在 QQ 里用 /offpeak holiday add 热维护
  # （覆盖持久化，重启不丢）。
  holidays: []
  # holidays:
  #   - 2027-01-01
  #   - 2027-01-02

# --- 富媒体输入（图片 / 语音 / 引用 / 卡片送进模型）--------------------------
# 与平台无关，官方与 OneBot 共用。环境变量前缀：BOT_ATTACHMENT_*
#
# 能收到什么、会怎么送进模型：
#   - 图片：官方 attachments(content_type=image/*) 与 OneBot image 段 → 内联成
#     多模态 image block（下载 → 嗅探真实格式 → 超限的降采样或切片 → base64）；
#   - 引用：官方 message_type=103 的 msg_elements、OneBot reply 段（回查 get_msg）
#     → 渲染成 `[引用 谁] 内容`，被引用消息里的图片同样会被内联；
#   - 转发消息块（合并转发 / 聊天记录）：优先用上报里已经带上的逐条内容，只有
#     拿到 id 时才回查 get_forward_msg → 渲染成带条号的逐条发言（谁说了什么一
#     目了然），见下方 forward 子节；
#   - 文件（PDF / 文本等）：下载 → 原文落工作区 inbox/ → 抽取正文送进模型
#     （PDF 走 pdftotext），见下方 files 子节；
#   - 语音：官方给 asr_refer_text 时直接用它的识别文本（本项目不做本地语音识别）；
#   - 视频/卡片：渲染成 `[视频: x.mp4]` / `[卡片消息 …]` 一行说明，不送字节。
#
# 注意：所有这些内容进 prompt 都会消耗额外的 token 与带宽；用本地小模型/纯文本
# 模型时建议把 enabled 设为 false（关掉后消息仍能收到，只是变成 `[图片]` 占位）。
attachments:
  # 是否把图片内联送进模型（需要模型支持多模态）
  enabled: true
  # 单条消息最多取几张图（含引用消息里的图片）。超出的只留文字说明。
  # 注意长图切片后**每块算一张**，因此一条消息最终内联的张数可能多于这个值
  # （另有 maxImageTiles 与 runtime 的"单条 prompt 最多 20 张"两道闸）。
  maxImages: 4
  # 单张图片内联进 prompt 的最大字节数（默认 8MB）。超限的**不再直接丢掉**：
  # 先尝试降采样/重新编码压到限内，实在压不下来才只留文字说明。
  # 下载阶段允许到 32MB（多拉的字节就是为了压到这里的限内）。
  maxImageBytes: 8388608
  # 一张长图最多切成几块。为什么需要切片：模型对**每张图**只有 64 万像素的
  # 预算（deepseek-flash 的 imagePixelBudget），1080×20000 的长截图整张缩下去
  # 只剩 185px 宽，文字完全不可读；切成 ≤64 万像素一块，每块都能按原分辨率读。
  # 12 块 ≈ 一张 1080×7100 的聊天记录，视觉 token 约 1 万；上限 20 是 runtime
  # 单条 prompt 的图片张数上限。调小省 token，调大读长图（超出部分会在正文里
  # 明确写"其余未读入"）。
  maxImageTiles: 12
  # 单张图片下载超时（毫秒）；下载失败会降级成文字说明，不影响文字部分回答
  downloadTimeoutMs: 15000

  # 转发消息块（合并转发 / 聊天记录）。env 前缀：BOT_ATTACHMENT_FORWARD_*
  # 四重上限都刻意保守：一个转发块动辄上百条，全量展开既烧 token 也把真正
  # 的问题淹掉。**超限不是错误**，是在正文里写一句"仅展开以上条目"。
  #
  # 展开的两条来源（按优先级）：
  #   1. 上报里已内联的逐条内容（NapCat 的 forward.data.content）——零请求、
  #      且不受"消息 id 约 5000 条后被 LRU 淘汰"影响；
  #   2. 只有 id 时回查 get_forward_msg（go-cqhttp / Lagrange 等）。
  #
  # ⚠️ 这里配的上限**同时管两条路径**：
  #   - @ 消息自带的转发：归一化后立刻展开（用户转发过来就是在说"看这个"）；
  #   - **旁听**消息里的转发：默认**不展开**（不当普通群聊上下文），只留占位与 id；
  #     只有被 @ 且这次的问题明确提到它时（由话题判定那一次 LLM 调用顺带判出）
  #     才回查。见 docs/DESIGN.md §11.10。
  forward:
    # 是否展开转发块。关掉后：OneBot 只留 `[聊天记录]` 占位（且不发任何回查请求，
    # 内联内容也不展开）；官方侧退化成平铺文本——它的内容随事件一起推来，
    # 丢掉纯属浪费。
    enabled: true
    # 单个转发块最多展开几条
    maxNodes: 20
    # 单条发言的字符上限（超出截断，防一条长文吃掉整个预算）
    maxNodeChars: 500
    # 一个转发块展开后的总字符上限
    maxChars: 4000
    # 最多再下钻几层嵌套转发（0 = 只展开最外层；最外层永远展开）
    maxDepth: 2
    # 回查超时（毫秒）
    timeoutMs: 10000

  # 文件（PDF 等）的下载与解析。env 前缀：BOT_ATTACHMENT_FILE_* / BOT_ATTACHMENT_INBOX_*
  # 机制（详见 docs/FORWARD-FILE-INGRESS-PLAN.md）：下载 → 原文落到工作区 inbox/
  # → 抽取正文（PDF 走 pdftotext，纯文本类直读）→ 截断后送进 prompt。
  # 落盘的意义是让 agent 能回头深挖（"把那份 PDF 的第三页表格给我"）。
  files:
    # 是否下载并解析文件
    enabled: true
    # 单条消息最多解析几个文件（超出的只列名字与体积）
    maxFiles: 2
    # 单文件字节上限；平台声明超限时不下载
    maxFileBytes: 16777216
    # 抽取文本的字符上限（超出截断并在 prompt 里说明）
    maxExtractChars: 20000
    # PDF 最多读多少页
    maxPdfPages: 30
    # 解析子进程超时（毫秒）
    extractTimeoutMs: 10000
    # 是否把原文落到工作区 inbox/（关掉后只把抽取的文本送进模型，agent 拿不到原件）
    saveToInbox: true
    # 工作区内目录名。**必须与 media.outboxDir 不同名**——outbox 是发回用户的，
    # 同名会让用户发来的文件被立刻回发给自己（启动期会直接报错拦下）。
    inboxDir: inbox
    # inbox 文件保留天数，超期清理（0 = 不清理）
    retentionDays: 7
    # 单会话 inbox 总字节上限（MB）。超出时**删最旧的**而不是拒绝新文件。
    maxInboxMB: 200
    # 允许抽取正文的扩展名白名单（小写）。不在名单里的文件**不下载**，只写一行说明。
    # 不建议把 sh / py / exe 这类可执行文件加进来：落盘位置是 agent 的工作区，
    # 而 agent 有执行能力——"用户发来的脚本被 agent 顺手跑一下"是没必要开的口子。
    extractExtensions: [pdf, txt, md, csv, json, yaml, yml, log, xml, html]

# --- 富媒体出站（把 agent 生成的文件发给用户）--------------------------------
# 与平台无关，官方与 OneBot 共用。环境变量前缀：BOT_MEDIA_*
#
# 机制（详见 docs/RICH-MEDIA-PLAN.md）：agent 把要发给用户的文件放进会话
# 工作区的 outbox/ 子目录（persona 里已约定），一轮回答结束后机器人扫描该
# 目录、逐个发送、发完归档到 outbox/.sent/。
#   - 图片（png/jpg/jpeg/gif，白名单见下）以图片消息内联展示；
#   - 其余一律以文件消息发送（可下载、可转发）；
#   - 官方平台附件与文本共享回复配额：平时给文本保底 1 条，
#     只剩 1 条额度时附件优先。
media:
  enabled: true
  # 单附件体积上限（MB）。超出的文件降级为文本里的一行说明。
  # base64 传输体积 +33%，不建议调大。
  maxFileMB: 20
  # 单次回复最多发几个附件，超出的降级为文本说明
  maxAttachmentsPerMsg: 4
  # 图片扩展名白名单（小写不带点）。svg/webp/bmp 等不在名单里的按文件发——
  # "以文件形式收到的 svg"用户能打开，"以图片形式发被平台拒掉的"什么都看不到。
  imageExtensions: [png, jpg, jpeg, gif]
  # 工作区内的约定目录名（纯目录名，不能含路径分隔符）
  outboxDir: outbox

# --- 健康检查 ----------------------------------------------------------------
# /healthz + /metrics；容器 HEALTHCHECK 探这个端口（compose 里未映射到宿主）
# --- 主动发言（旁听 → 判定 → 主动开口）---------------------------------------
# 环境变量前缀：BOT_PROACTIVE_* / QQ_INTERESTS_FILE
#
# 当前生效的场景清单与判据见 src/pipeline/proactive/interests/SCENES.md
# （那份文件是场景的自然语言真相源；新增场景请先改它再改代码）。
proactive:
  enabled: true          # 总开关，默认关（fail-closed：不配就不主动开口）
  # 灰度观察：判定照跑、记录"本应发言"，但永不真的发。**默认开**——
  # 即使手滑打开了总开关，也先观察一到两周，确认判据准了再显式关掉它。
  dryRun: false
  # 兴趣池（场景 5）：整份内容会进判定 prompt，因此单独成文件、有独立 schema。
  # 文件不存在 = 空池（合法，场景 5 不触发）；文件存在但格式错 = 启动期报错。
  interestsEnabled: true
  interestsFile: interests.yml
  # bot 在本群的别名（场景 4 指代检测用）。留空 = 只认"机器人/助手"这类泛称
  # 且必须与请求词同现，误命中率更低。
  botAliases:
    - 大肥鱼
    - 肥鱼
    - 阿梁梁
    - DS
  # 话题滚动周期（场景 2/5 的入口）：每多少条旁听消息、或静默多久，
  # 收敛一次交给判定。默认比既有采样口径保守（宁缺勿滥）。
  topicRollMessages: 30
  topicRollMs: 300000
  # 问题挂起多久后探针（场景 3）：先给群里留出回答时间。
  questionProbeMs: 90000
  # 「让路」的预算与时长（场景 3 的 wait）：判定说"有人在答"时，
  # 只把**下一次唤醒提前一点**，而不是另起一台独立于对象的等待机器。
  #   maxWaitPerItem：同一个挂起问题最多让路几次。**默认 1（只能让一次）**，
  #                   硬上限 3——配得更大按 3 处理并在日志里 warn，因为
  #                   "把收敛改回不收敛"不该只需要改一行配置。
  #   waitYieldMs   ：让路后多久重查（毫秒，范围 15000–120000）。重查前有两道
  #                   **本地**检查（对象还在吗 / 转录有新增吗），任何一道不过
  #                   都不花判定调用；问题一旦被回答，等待当场作废。
  # 指标：wait_ticket_created / _resolved / _spent / _stale / _unchanged
  #       + wait_declined{reason}（/metrics 的 proactive 段）。
  maxWaitPerItem: 1
  waitYieldMs: 45000
  # --- 话题 session（主动发言的**唯一放行闸门**）------------------------------
  # 一次唤醒（主动/被动）→ LLM 判断 → 输出；判定说"值得"时**额外开一个话题
  # session**，在这个 session 下打开主动发言闸门，直到预算用完或被关闭。
  # 取舍已拍板：**放弃介入话题的覆盖率，换精度**——不是所有值得聊的话题都会
  # 介入，话题切换时也可能漏掉一轮机会（已知并接受，不做 topicChange）。
  # 观测：health 的 proactive.sessions（opened / closedBy / spokeInSession）。
  #
  #   sessionBudget  ：一个话题里允许的主动发言条数。默认 2，
  #                    **硬上限 5**——配得更大按 5 处理并在日志里 warn
  #                    （"少说两句"是产品决策，不该被一行配置改回去）。
  #                    ⚠️ 预算用完**不关闭 session**，只让它在当前话题里闭嘴
  #                    （预算不该驱动会话的生死）。要重新开口只有两条路，都由
  #                    **话题**驱动：模型说"换话题了"（new-topic，预算重置），
  #                    或者会话收口 / 静默超时后由下一次判定重新开一个。
  #                    指标：`proactive.sessions.budgetExhausted` = 被额度挡下的次数。
  #   sessionIdleMs  ：静默多久自动关闭 session（毫秒，范围 60000–3600000）。
  #                    锚点是 bot **自己**上次在这个 session 里发言的时间
  #                    （没说过则是开启时刻），刻意不被群消息刷新。
  #                    它同时也是"话题翻篇"的口径：会话结束后预算自然回到满值。
  #   sessionMinGapMs：同一 session 内两次发言的最小间隔（毫秒，范围
  #                    10000–300000）。间隔没到时闸门不过，且**不消耗预算**
  #                    （预算是"说了几句"的账，不是"想过几次"的账）。
  sessionBudget: 2
  sessionIdleMs: 600000
  sessionMinGapMs: 45000
  # 判定调用超时。刻意与 topic.timeoutMs 分开：话题判定只输出一个布尔值
  # （10 秒够），而主动介入要逐场景输出多段 JSON——借用 10 秒会频繁超时，
  # 而超时 = 沉默，表现就是「它从来不主动说话」。
  judgeTimeoutMs: 20000
  # 发言生成（措辞轮次）超时：判定说"值得说"之后，真实文案由一次 agent turn
  # 生成（与被动回复同一条链路：同会话、同观察窗口、可以用工具查证）。
  # 它是"插一句话"不是"跑一个任务"，上限刻意低于被动轮次——
  # 超时的表现是**本次不发言**（health 里 deliveryDegraded['compose-failed'] +1），
  # 不是报错。范围 30000–300000。
  speakTimeoutMs: 120000

# --- 观察窗口（旁听滚窗）-------------------------------------------------------
#
# 「群里刚刚说了什么」的唯一来源。被 @ 的回复与主动发言判定读的是**同一份**，
# 因此它放在顶层、**与 BOT_PROACTIVE_ENABLED 无关**：把主动发言关掉，被 @ 时
# 照样能拿到上下文（这正是它与介入层解耦的意义）。
#
# 两条纪律：
#   - 静默：只记录，不判断、不调 LLM、不回复；
#   - **纯内存、不落盘**：进程重启即清空。冷启动那一次没有群聊上下文，靠
#     `pool.replayTurns` 的对话记录回放兜底（那份落盘、且只记与 bot 相关的轮次）。
#
# 观察范围 = BOT_LISTEN_GROUPS（与介入层共用同一个白名单），留空 = 什么都不观察。
observation:
  # 每会话保留的消息条数上限（环境变量：BOT_OBSERVATION_MAX_MESSAGES）。
  maxMessages: 200
  # 每条消息的最长保留时长（毫秒，默认 1800000 = 30 分钟，
  # 环境变量：BOT_OBSERVATION_MAX_AGE_MS）。
  # ⚠️ 这是「记得多久」，不是「注入多少」——注入宽度见下一项，刻意窄得多。
  maxAgeMs: 1800000
  # 被 @ 时注入的窗口宽度（毫秒，默认 600000 = 10 分钟，范围 60000–3600000，
  # 环境变量：BOT_OBSERVATION_INJECT_WINDOW_MS）。
  # 与判定层的活动窗口同值：回答"在吗，帮我看看这个"时，把半小时前另一个话题的
  # 200 条灌进去只会稀释注意力。
  injectWindowMs: 600000
  # 被 @ 时最多把上下文里的几张图片内联进 prompt（默认 2，范围 0–20，
  # 环境变量：BOT_OBSERVATION_INJECT_IMAGES）。
  # 为什么需要它：上下文里的 `[图片: x.jpg]` 只是占位，**光有占位模型看不到图**——
  # "群里先发一张图、再 @ bot 问这是什么"因此只会得到"这张图没到我这儿"。
  # 取的是**最近**的几张（"看看这个"指的就是刚发的那张）。0 = 不内联，只留占位文本。
  # ⚠️ 图片按像素烧 token：它与 attachments.maxImages 一起决定单轮的图片预算上界，
  # 两者还共享模型单条 20 张的硬上限（见 docs/RUNBOOK.md 4.5）。
  injectImages: 2
  # 被 @ 时最多摄取几个上下文里的文件（默认 1，范围 0–10，
  # 环境变量：BOT_OBSERVATION_INJECT_FILES）。
  # 比图片更保守：文件要下载、落 inbox、可能起 pdftotext 子进程。
  # 0 = 不摄取（上下文里仍显示 `[文件: x.pdf]` 占位）。
  injectFiles: 1

# 群白名单 → 在 .env 里配 BOT_LISTEN_GROUPS（群号是个人标识，不进本文件）：
#   BOT_LISTEN_GROUPS=onebot:123456,ob11:g987654
# 留空 = 不接任何群（fail-closed）。条目必须带平台前缀，否则启动期报错。

health:
  port: 8080

# --- 日志级别 ----------------------------------------------------------------
# debug | info | warn | error
# 环境变量：QQ_LOG_LEVEL
logLevel: info
