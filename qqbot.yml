# ============================================================================
# qqbot-dsh 行为配置（本文件随仓库提供，就是默认配置，**不需要复制**）
#
#   docker compose up -d      # 直接用；要改就改这里
#   docker compose restart qqbot   # 改完重启生效，不用重建镜像
#
# 密钥**不在这里**——它们只从环境读（.env 会被整份注入容器）：
#   QQ_APP_ID / QQ_APP_SECRET / DEEPSEEK_API_KEY / ONEBOT_ACCESS_TOKEN / BOT_ADMINS
#
# 取值优先级：环境变量 > 本文件 > 代码内置默认。
# 也就是说本文件里每一项都可以用对应的环境变量临时覆盖（变量名见每节注释）：
# 写进 .env 即可（它整份注入），或加到 compose 的 environment 段。
#
# 键名拼错会在启动期直接报错并列出可用项（不会静默用默认值），所以放心改。
#
# 本文件既不含密钥、也不含个人标识（管理员白名单在 .env 的 BOT_ADMINS，见下），
# 所以可以安全提交；改动它就是一份普通的本地 diff。
# ============================================================================

# --- 接入平台 ----------------------------------------------------------------
# 可并存，共享同一个 DSH 池与编排层。
#   qq-official  官方开放平台（api.bot.qq.com）
#   onebot       社区框架（LLBot / NapCat 等 OneBot v11 实现，反向 WS 接入）
# 环境变量：BOT_CONNECTORS
connectors:
  - qq-official
  - onebot

# --- 官方开放平台（connectors 含 qq-official 时生效）-------------------------
# 环境变量前缀：QQ_*
qq-official:
  # OpenAPI 基址；2026-08-10 起统一为 api.bot.qq.com
  apiBase: https://api.bot.qq.com
  # 订阅的 intents 位掩码。
  # 默认 = GROUP_AND_C2C_EVENT(1<<25) + GROUP_MEMBER_EVENT(1<<24) = 50331648
  # 注意：1<<25 同时承载群聊 @消息与单聊消息，intent 层无法只订其中一种。
  # 如果连接被 4014（intent 无权限）拒绝，把这里改成 33554432 再试。
  intents: 50331648
  # 发消息用 0(纯文本) 还是 2(markdown)。markdown 的渲染效果依客户端版本而异，
  # 所以默认走纯文本。
  msgType: 0
  # 单条消息最大字符数。官方未公布数值上限，只在超限时报 40054007，保守取 1500。
  maxChars: 1500
  # 群聊一次提问允许的最大回复条数（官方硬上限 5，留 1 条余量给错误提示）
  maxRepliesPerMsg: 4
  # 进度回执：turn 超过多少毫秒后发第一条「仍在处理中」
  progressAfterMs: 90000
  progressIntervalMs: 90000
  # 进度回执条数上限，必须小于 maxRepliesPerMsg（给最终答案留配额）
  progressMax: 3
  # 单轮任务超时（毫秒），到点取消该轮。
  # 硬约束：必须 < 300000 —— 群聊被动回复窗口只有 5 分钟，超时提示也要在窗口内发出。
  turnTimeoutMs: 240000
  # 单聊（C2C）。单聊与群聊共用 1<<25 这一个 intent，无法在订阅层屏蔽，
  # 所以要"只服务群聊"必须靠这个开关。
  c2c:
    enabled: true
    # 单聊每条消息最大回复条数。官方上限 4（群聊是 5，两个值不能共用）。
    maxRepliesPerMsg: 4
    # 单聊进度回执上限，必须小于上面的 maxRepliesPerMsg
    progressMax: 2

# --- OneBot v11 社区框架（connectors 含 onebot 时生效）-----------------------
# 环境变量前缀：ONEBOT_*
# 接入方式：本服务起 WS server，LLBot/NapCat 作为客户端连入（反向 WS）。
# 框架侧要填：ws://127.0.0.1:6700/onebot/v11/ws，token 与 ONEBOT_ACCESS_TOKEN 一致。
onebot:
  # ⚠⚠ 必须保持 0.0.0.0，不要改成 127.0.0.1。
  #   框架跑在宿主、本服务在 Docker 时，宿主看到的 127.0.0.1:6700 是 Docker 的
  #   端口转发，它落到**容器网卡**上；容器里若只绑 loopback，转发就够不到，
  #   症状是"端口映射看着正常但框架死活连不上"。
  host: 0.0.0.0
  # ⚠ 不要改这个端口：docker-compose.yml 里的端口映射写死了 127.0.0.1:6700:6700，
  #   改这里会让映射指空。要改就得两处一起改。
  port: 6700
  # 是否响应私聊消息
  c2cEnabled: true
  # 收到加好友请求时自动同意（否则私聊路径永远打不开）
  autoAcceptFriend: true
  # 收到拉群邀请时自动同意。默认关闭：被拉进陌生群 = 把 agent 暴露给陌生人。
  autoAcceptGroupInvite: false
  maxChars: 1500
  # OneBot 没有平台级回复配额，这里只是防失控的安全阀
  maxRepliesPerMsg: 10
  progressMax: 3
  progressAfterMs: 90000
  progressIntervalMs: 90000
  # OneBot 没有被动回复窗口，单轮超时可以放宽到任务真正需要的时长
  turnTimeoutMs: 600000
  # 附件字节怎么传给框架（环境变量 ONEBOT_FILE_TRANSPORT）：
  #   base64（默认）：文件内容编码进 WS 帧，跨容器部署也能用；
  #   path          ：只传绝对路径，要求 bot 与框架同机同文件系统（省 33% 体积）。
  # 注意 ws 库的 maxPayload 默认 100MiB，与 media.maxFileMB 联动。
  fileTransport: base64

# --- DSH runtime -------------------------------------------------------------
dsh:
  provider: deepseek-official
  model: deepseek-flash
  # profile patch 的绝对路径（容器内由 compose 指定，一般不用改）
  profilePatch: /app/dsh-profile/cordis.patch.yml
  # dsh 可执行文件；默认从 PATH 解析
  bin: dsh
  startTimeoutMs: 60000
  shutdownTimeoutMs: 15000

# --- 运行时池 ----------------------------------------------------------------
pool:
  # 全局并发 turn 上限（= 同时干活的会话数上限）
  maxConcurrentTurns: 4
  # 并发 runtime 进程上限（LRU 回收）
  maxRuntimes: 8
  # 空闲 runtime 回收时间（毫秒），回收后该会话下次提问会重建会话并回放历史
  runtimeIdleMs: 1800000
  # 冷启动回放的历史轮数
  replayTurns: 12

# --- 话题判定 ---------------------------------------------------------------
# 新消息与既有话题是否相关，由一个小模型调用判断（不经 DSH 进程）：
# 判定为无关 → 关闭话题（回收 runtime、跳过冷启动回放），已结束的话题不再
# 赖在上下文里。判定失败/超时一律视为相关（fail-safe，不误清上下文）。
# 管理员也可以在群里发 /new 显式开新话题。
# 密钥复用 .env 的 DEEPSEEK_API_KEY；环境变量前缀 BOT_TOPIC_*
topic:
  enabled: true
  apiBase: https://api.deepseek.com
  model: deepseek-flash
  # 单次判定超时（毫秒）；超时按相关处理
  timeoutMs: 10000
  # 送给判定器的最近记录条数（不含当前新消息）
  contextTurns: 10

# --- 存储路径 ----------------------------------------------------------------
# 容器内由 docker-compose 的 environment 指定；这两处要保持一致。
paths:
  dshHome: /data/dsh
  workspacesRoot: /data/workspaces
  stateDir: /data/bot

# --- 管理员白名单 → 在 .env 里配，不在这里 ------------------------------------
# 这是本文件里唯一会带个人标识的配置（真实 QQ 号 / openid），所以刻意**不放进
# 配置文件**，也不接受写在这里——写在这里会在启动期直接报错并告诉你该去哪配。
#
#   # .env 里：
#   BOT_ADMINS=qq-official:ABCDEF123456,onebot:123456
#
# 条目格式 `平台:发送者id`：
#   - qq-official:<openid>   群聊里是 member_openid，单聊里是 user_openid，
#                            同一个人两个值不同，都要管就都加进来
#   - onebot:<QQ号>
# 管理员两个特权：永不被谷时段闸拦截；可用 /offpeak 变更类命令热切换闸配置。
# 发现自己身份键：直接给机器人发 `/offpeak whoami`（对所有人开放）。
# 留空 = 没有管理员，变更类命令对所有人关闭（fail-closed）。
# 旧变量 QQ_ADMIN_OPENIDS 仍兼容（裸 openid 自动补 qq-official: 前缀）。

# --- DeepSeek 谷时段闸 -------------------------------------------------------
# 开启后：当 <dsh.provider>/<dsh.model> 命中 modelPattern，且当前不是谷时段时，
# 直接回复提示、不调用 API（不写对话记录、不占并发名额）。
# 环境变量前缀：QQ_OFFPEAK_*
offpeak:
  enabled: true
  # 工作日谷时段窗口，一天可以有多个，逗号分隔；每个窗口是 HH:MM-HH:MM，
  # 区间为 [start, end)。默认北京时间 00:00-09:00、12:00-14:00、18:00-24:00
  # （窗口之外 09:00-12:00、14:00-18:00 是正价时段）。
  #   - 结束时间可写 24:00 表示当天结束；也支持跨零点（如 22:00-06:00）
  #   - 窗口之间不能重叠（重叠会在启动期报错）
  #   - 也可以写成 YAML 数组：["00:00-09:00", "12:00-14:00", "18:00-24:00"]
  windows: 00:00-09:00,12:00-14:00,18:00-24:00
  # 窗口所在时区（IANA 名称；容器内默认 UTC，不要依赖宿主时区）
  timeZone: Asia/Shanghai
  # 命中判定：provider/model 组合串包含该子串（大小写不敏感）
  modelPattern: deepseek
  # 周六、周日全天按谷价（2026-08-23 起官方规则；调休上班的周末仍是周六/日，
  # 由本规则自动覆盖，无需额外配置）
  weekendsAllDay: true
  # 法定节假日全天谷价：已内置 2026 年官方节假日（国办发明电〔2025〕7 号）。
  # 跨年或临时日期在这里追加，或让管理员在 QQ 里用 /offpeak holiday add 热维护
  # （覆盖持久化，重启不丢）。
  holidays: []
  # holidays:
  #   - 2027-01-01
  #   - 2027-01-02

# --- 富媒体输入（图片 / 语音 / 引用 / 卡片送进模型）--------------------------
# 与平台无关，官方与 OneBot 共用。环境变量前缀：BOT_ATTACHMENT_*
#
# 能收到什么、会怎么送进模型：
#   - 图片：官方 attachments(content_type=image/*) 与 OneBot image 段 → 内联成
#     多模态 image block（下载 → 嗅探真实格式 → base64）；
#   - 引用：官方 message_type=103 的 msg_elements、OneBot reply 段（回查 get_msg）
#     → 渲染成 `[引用 谁] 内容`，被引用消息里的图片同样会被内联；
#   - 转发消息块（合并转发 / 聊天记录）：OneBot forward 段回查 get_forward_msg
#     → 渲染成带条号的逐条发言（谁说了什么一目了然），见下方 forward 子节；
#   - 文件（PDF / 文本等）：下载 → 原文落工作区 inbox/ → 抽取正文送进模型
#     （PDF 走 pdftotext），见下方 files 子节；
#   - 语音：官方给 asr_refer_text 时直接用它的识别文本（本项目不做本地语音识别）；
#   - 视频/卡片：渲染成 `[视频: x.mp4]` / `[卡片消息 …]` 一行说明，不送字节。
#
# 注意：所有这些内容进 prompt 都会消耗额外的 token 与带宽；用本地小模型/纯文本
# 模型时建议把 enabled 设为 false（关掉后消息仍能收到，只是变成 `[图片]` 占位）。
attachments:
  # 是否把图片内联送进模型（需要模型支持多模态）
  enabled: true
  # 单条消息最多内联几张图（含引用消息里的图片）。超出的只留文字说明。
  maxImages: 4
  # 单张图片最大字节数。超限的只留文字说明——QQ 单图硬上限是 200MB，
  # 照单全收会把 prompt 撑爆。
  maxImageBytes: 8388608
  # 单张图片下载超时（毫秒）；下载失败会降级成文字说明，不影响文字部分回答
  downloadTimeoutMs: 15000

  # 转发消息块（合并转发 / 聊天记录）。env 前缀：BOT_ATTACHMENT_FORWARD_*
  # 四重上限都刻意保守：一个转发块动辄上百条，全量展开既烧 token 也把真正
  # 的问题淹掉。**超限不是错误**，是在正文里写一句"仅展开以上条目"。
  forward:
    # 是否展开转发块。关掉后：OneBot 只留 `[聊天记录]` 占位（且不发任何回查请求）；
    # 官方侧退化成平铺文本——它的内容随事件一起推来，丢掉纯属浪费。
    enabled: true
    # 单个转发块最多展开几条
    maxNodes: 20
    # 单条发言的字符上限（超出截断，防一条长文吃掉整个预算）
    maxNodeChars: 500
    # 一个转发块展开后的总字符上限
    maxChars: 4000
    # 最多再下钻几层嵌套转发（0 = 只展开最外层；最外层永远展开）
    maxDepth: 2
    # 回查超时（毫秒）
    timeoutMs: 10000

  # 文件（PDF 等）的下载与解析。env 前缀：BOT_ATTACHMENT_FILE_* / BOT_ATTACHMENT_INBOX_*
  # 机制（详见 docs/FORWARD-FILE-INGRESS-PLAN.md）：下载 → 原文落到工作区 inbox/
  # → 抽取正文（PDF 走 pdftotext，纯文本类直读）→ 截断后送进 prompt。
  # 落盘的意义是让 agent 能回头深挖（"把那份 PDF 的第三页表格给我"）。
  files:
    # 是否下载并解析文件
    enabled: true
    # 单条消息最多解析几个文件（超出的只列名字与体积）
    maxFiles: 2
    # 单文件字节上限；平台声明超限时不下载
    maxFileBytes: 16777216
    # 抽取文本的字符上限（超出截断并在 prompt 里说明）
    maxExtractChars: 20000
    # PDF 最多读多少页
    maxPdfPages: 30
    # 解析子进程超时（毫秒）
    extractTimeoutMs: 10000
    # 是否把原文落到工作区 inbox/（关掉后只把抽取的文本送进模型，agent 拿不到原件）
    saveToInbox: true
    # 工作区内目录名。**必须与 media.outboxDir 不同名**——outbox 是发回用户的，
    # 同名会让用户发来的文件被立刻回发给自己（启动期会直接报错拦下）。
    inboxDir: inbox
    # inbox 文件保留天数，超期清理（0 = 不清理）
    retentionDays: 7
    # 单会话 inbox 总字节上限（MB）。超出时**删最旧的**而不是拒绝新文件。
    maxInboxMB: 200
    # 允许抽取正文的扩展名白名单（小写）。不在名单里的文件**不下载**，只写一行说明。
    # 不建议把 sh / py / exe 这类可执行文件加进来：落盘位置是 agent 的工作区，
    # 而 agent 有执行能力——"用户发来的脚本被 agent 顺手跑一下"是没必要开的口子。
    extractExtensions: [pdf, txt, md, csv, json, yaml, yml, log, xml, html]

# --- 富媒体出站（把 agent 生成的文件发给用户）--------------------------------
# 与平台无关，官方与 OneBot 共用。环境变量前缀：BOT_MEDIA_*
#
# 机制（详见 docs/RICH-MEDIA-PLAN.md）：agent 把要发给用户的文件放进会话
# 工作区的 outbox/ 子目录（persona 里已约定），一轮回答结束后机器人扫描该
# 目录、逐个发送、发完归档到 outbox/.sent/。
#   - 图片（png/jpg/jpeg/gif，白名单见下）以图片消息内联展示；
#   - 其余一律以文件消息发送（可下载、可转发）；
#   - 官方平台附件与文本共享回复配额：平时给文本保底 1 条，
#     只剩 1 条额度时附件优先。
media:
  enabled: true
  # 单附件体积上限（MB）。超出的文件降级为文本里的一行说明。
  # base64 传输体积 +33%，不建议调大。
  maxFileMB: 20
  # 单次回复最多发几个附件，超出的降级为文本说明
  maxAttachmentsPerMsg: 4
  # 图片扩展名白名单（小写不带点）。svg/webp/bmp 等不在名单里的按文件发——
  # "以文件形式收到的 svg"用户能打开，"以图片形式发被平台拒掉的"什么都看不到。
  imageExtensions: [png, jpg, jpeg, gif]
  # 工作区内的约定目录名（纯目录名，不能含路径分隔符）
  outboxDir: outbox

# --- 健康检查 ----------------------------------------------------------------
# /healthz + /metrics；容器 HEALTHCHECK 探这个端口（compose 里未映射到宿主）
# --- 主动发言（旁听 → 判定 → 主动开口）---------------------------------------
# 环境变量前缀：BOT_PROACTIVE_* / QQ_INTERESTS_FILE
#
# 当前生效的场景清单与判据见 src/pipeline/proactive/interests/SCENES.md
# （那份文件是场景的自然语言真相源；新增场景请先改它再改代码）。
proactive:
  enabled: false          # 总开关，默认关（fail-closed：不配就不主动开口）
  # 兴趣池（场景 5）：整份内容会进判定 prompt，因此单独成文件、有独立 schema。
  # 文件不存在 = 空池（合法，场景 5 不触发）；文件存在但格式错 = 启动期报错。
  interestsEnabled: true
  interestsFile: interests.yml
  # bot 在本群的别名（场景 4 指代检测用）。留空 = 只认"机器人/助手"这类泛称
  # 且必须与请求词同现，误命中率更低。
  botAliases: []
  # 话题滚动周期（场景 2/5 的入口）：每多少条旁听消息、或多久没仲裁，
  # 收敛一次交给判定。默认比既有采样口径保守（宁缺勿滥）。
  topicRollMessages: 30
  topicRollMs: 300000

health:
  port: 8080

# --- 日志级别 ----------------------------------------------------------------
# debug | info | warn | error
# 环境变量：QQ_LOG_LEVEL
logLevel: info
