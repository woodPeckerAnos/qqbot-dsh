# ============================================================================
# QQ 机器人 × DSH —— 目标部署入口
#
#   cp .env.example .env                   # 只填密钥（qqbot.yml 已在仓库里，直接用）
#   docker compose up -d --build
#   docker compose logs -f
#
# 安全模型（详见 docs/DESIGN.md 第 6 节）：
#   agent 在容器内拥有 workspace-write 权限，工作区之外由沙箱挡住；
#   容器本身是第二道边界——只读根文件系统、能力收敛、资源上限。
# ============================================================================

services:
  qqbot:
    build:
      context: .
      dockerfile: Dockerfile
    image: qqbot-dsh:0.1.0
    container_name: qqbot-dsh
    restart: unless-stopped

    # --- 密钥：只显式传这几个，不用 env_file ---------------------------------
    # 为什么不用 `env_file: .env`：
    #   1. env_file 会把**整份文件**当成容器环境变量塞进去，于是文件里任何一行
    #      格式不对都会在创建容器时炸掉。最典型的是"一行全是 ="（比如从 Markdown
    #      预览里复制配置时，`# =====` 被渲染成标题、`#` 被吃掉），Compose 会把它
    #      解析成**变量名为空**的条目，daemon 报
    #      `invalid environment variable: =====...`。这种报错完全看不出该改哪一行。
    #   2. 只传需要的变量，容器内也少了一堆无关的键。
    # 下面这些仍然从项目根的 .env 取值（Compose 自动加载该文件用于插值）；
    # 值里有 `$` 的要写成 `$$`，这是 Compose 插值的规则。
    # ⚠ 行为参数**不在这里**，在挂进来的 qqbot.yml。
    environment:
      QQ_APP_ID: "${QQ_APP_ID:-}"
      QQ_APP_SECRET: "${QQ_APP_SECRET:-}"
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:-}"
      ONEBOT_ACCESS_TOKEN: "${ONEBOT_ACCESS_TOKEN:-}"
      BOT_ADMINS: "${BOT_ADMINS:-}"
      # 旧变量：仍在用 QQ_ADMIN_OPENIDS 的部署不用改，代码会自动补平台前缀
      QQ_ADMIN_OPENIDS: "${QQ_ADMIN_OPENIDS:-}"

      DSH_HOME: /data/dsh
      QQ_WORKSPACES_ROOT: /data/workspaces
      QQ_STATE_DIR: /data/bot
      QQ_DSH_PROFILE_PATCH: /app/dsh-profile/cordis.patch.yml
      # 行为配置从挂进来的 qqbot.yml 读（仓库自带的默认配置，密钥仍来自 .env）。
      QQ_CONFIG_FILE: /app/qqbot.yml
      # A 方案：保持 workspace-write。审批由 profile 里的 auto-approve 桩兜住。
      # 注意 DSH_PERMISSION_MODE 只能设成 danger-full-access 或留空；
      # profile patch 已显式钉死 sandbox 模式，这里不用动。
      TZ: Asia/Shanghai

      # --- 出网代理：web_fetch 能不能抓到正文，取决于这三行 ----------------
      # 为什么必须显式设代理（详见 docs/DEPLOY.md 第 9 节）：
      #   DSH 的 http fetch provider 发请求前会自己解析域名，并要求解析结果
      #   全部是公网单播地址，否则直接抛 WEB_BLOCKED_URL，连请求都不发。
      #   宿主如果开了 fake-IP 模式的代理（Clash/Surge 一类），域名会被解析成
      #   RFC2544 保留段 198.18.0.0/15，于是每次 web_fetch 都被自家策略拦下，
      #   表现为"能搜索、但抓不到原文"。
      #   设了代理后 provider 会命中它的代理分支：跳过 DNS 与公网校验，由代理
      #   去解析源站。web_search 不受影响（那是 DeepSeek 服务端搜索）。
      #
      # ⚠ 端口要与你宿主代理的「HTTP/混合端口」一致（这里 7897 是 Clash 的
      #   混合端口；常见值还有 7890）。改端口只改这两行。
      # ⚠ 必须是 HTTP(S) 代理。dsh-http-proxy 不支持 SOCKS/PAC，会打诊断后跳过。
      # ⚠ 绝对不要把想抓取的站点写进 NO_PROXY：那会让它退回直连分支，公网校验
      #   重新生效，又变成 WEB_BLOCKED_URL。
      HTTPS_PROXY: http://host.docker.internal:7897
      HTTP_PROXY: http://host.docker.internal:7897

    volumes:
      - dsh-home:/data/dsh            # DSH 会话日志、settings、凭证
      - workspaces:/data/workspaces   # 每个 QQ 群一个工作区目录
      - bot-state:/data/bot           # 机器人自身的对话记录 / 去重 / 会话映射
      # 行为配置（只读，随仓库提供，不需要复制）。
      # ⚠ 别把这个文件删掉：bind mount 的宿主文件不存在时 Docker 会自动建一个同名
      #   **目录**，容器里读到目录会拒绝启动（报错里会告诉你用 git checkout 恢复）。
      # ⚠ 容器以非 root（uid 10001）运行，所以本文件要对其他用户可读；启动若报
      #   "没有权限读取配置文件"，在宿主机执行 chmod 644 qqbot.yml。
      - ./qqbot.yml:/app/qqbot.yml:ro

    # --- 容器加固 -----------------------------------------------------------
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

    # 资源上限。注意 agent 可能拉起重型构建，按需调整。
    #
    # ⚠ 只在这一处写资源限制，不要与顶层旧式字段（pids_limit / mem_limit / cpus）
    #   混用：Docker Compose 2.x+ 会把 deploy.resources.limits 映射到同一批
    #   底层键，重复设置会直接报
    #   "can't set distinct values on 'pids_limit' and 'deploy.resources.limits.pids'"。
    #   pids 上限的意义：agent 能执行任意命令，必须挡 fork 炸弹。
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2g
          pids: 512
        reservations:
          memory: 256m

    # --- 可观测性 -----------------------------------------------------------
    healthcheck:
      test: ["CMD", "node", "dist/health-probe.js"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

    # 出网：容器需要访问 api.bot.qq.com（QQ 官方网关）、api.deepseek.com（模型）
    # 以及上面 HTTPS_PROXY 指向的宿主代理。默认 bridge 网络即可。
    #
    # extra_hosts 是代理方案的一部分：让 host.docker.internal 在所有平台上都
    # 指向宿主（Docker Desktop 自带该名称，Linux 原生 Docker 没有，靠这行补上）。
    extra_hosts:
      - "host.docker.internal:host-gateway"

    # OneBot 反向 WS 监听端口（BOT_CONNECTORS 含 onebot 时才需要）。
    # 框架（LLBot / NapCat）原生跑在宿主时，它作为客户端连到这里的 6700。
    # 只绑 127.0.0.1：家庭局域网里其他设备也连不上；框架在别的机器上才改成宿主局域网 IP。
    # ⚠ 端口有 ONEBOT_ACCESS_TOKEN 鉴权，但不要映射到公网。
    ports:
      - "127.0.0.1:6700:6700"

    networks:
      - qqbot-net

networks:
  qqbot-net:
    driver: bridge

volumes:
  dsh-home:
  workspaces:
  bot-state:
